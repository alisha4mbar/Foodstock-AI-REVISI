# Produksi: hanya Caddy (80/443) yang terbuka ke internet. Jalankan:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-foodstock_ai}
      MYSQL_USER: ${DB_USERNAME:-foodstock}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: id
      APP_KEY: ${APP_KEY:?isi APP_KEY}
      APP_URL: https://${DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-foodstock_ai}
      DB_USERNAME: ${DB_USERNAME:-foodstock}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MAILER: log
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FOODSTOCK_ADMIN_EMAILS: ${FOODSTOCK_ADMIN_EMAILS:?isi FOODSTOCK_ADMIN_EMAILS}
      FOODSTOCK_ROLE_PASSWORD: ${FOODSTOCK_ROLE_PASSWORD:-}

  frontend:
    build:
      context: ./foodstock-frontend
      args:
        SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET}
    restart: always
    depends_on:
      - backend
    environment:
      LARAVEL_API_URL: http://backend:8000/api/v1
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
