# FoodStock AI — jalankan semuanya dengan:  docker compose up --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-foodstock_ai}
      MYSQL_USER: ${DB_USERNAME:-foodstock}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodstock_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: id
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-foodstock_ai}
      DB_USERNAME: ${DB_USERNAME:-foodstock}
      DB_PASSWORD: ${DB_PASSWORD:-foodstock_pass}
      MAIL_MAILER: log
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FOODSTOCK_ADMIN_EMAILS: ${FOODSTOCK_ADMIN_EMAILS:?Isi FOODSTOCK_ADMIN_EMAILS di file .env}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./foodstock-frontend
      args:
        SESSION_SECRET: ${SESSION_SECRET:-ganti-dengan-string-acak-panjang}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      LARAVEL_API_URL: http://backend:8000/api/v1
      SESSION_SECRET: ${SESSION_SECRET:-ganti-dengan-string-acak-panjang}
      COOKIE_SECURE: "false"   # ubah ke "true" bila sudah memakai HTTPS
    ports:
      - "3000:3000"

volumes:
  dbdata:
